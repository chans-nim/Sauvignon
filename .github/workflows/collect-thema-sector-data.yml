# 테마 대/중분류 섹터 리포트: 평일 KST 16:00 (UTC 07:00) + 수동 실행
# - 이전 thema-sector-* 릴리즈의 theme_snapshot 을 받아 히스토리 디렉터리를 채운 뒤 수집한다.
# - 수집 후 동일 태그 형식으로 릴리즈하여 다음 실행이 히스토리를 이어 받게 한다.
name: Collect thema sector data

on:
  workflow_dispatch:
  schedule:
    - cron: "0 7 * * 1-5"

permissions:
  contents: write

concurrency:
  group: collect-thema-sector-data
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
      TZ: Asia/Seoul
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Restore theme history from releases
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python -m scripts.sync_theme_history_from_github_releases \
            --repo "${{ github.repository }}" \
            --dest-dir data/theme_history \
            --max-releases 60

      - name: Collect thema sector data
        env:
          KIS_APP_KEY: ${{ secrets.KIS_APP_KEY }}
          KIS_APP_SECRET: ${{ secrets.KIS_APP_SECRET }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID_STOCK: ${{ secrets.TELEGRAM_CHAT_ID_STOCK }}
          TELEGRAM_MESSAGE_THREAD_ID: ${{ secrets.TELEGRAM_MESSAGE_THREAD_ID }}
        run: |
          python -m scripts.collect_thema_sector_data --enrichment-workers 6 --telegram

      - name: Compute release tag (KST)
        id: rel
        run: |
          echo "tag=thema-sector-$(date +%Y%m%d-%H%M)" >> "$GITHUB_OUTPUT"

      - name: Publish thema sector release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python -m scripts.publish_thema_sector_release \
            --repo "${{ github.repository }}" \
            --tag "${{ steps.rel.outputs.tag }}"
