name: Publish Snapshot Asset (URL or Latest Release -> GitHub Release)

on:
  workflow_dispatch:
    inputs:
      mode:
        description: "Bootstrap = download from URL (초기 1회). FromLatest = use latest release and re-release (이후)"
        required: true
        default: "bootstrap"
        type: choice
        options:
          - bootstrap
          - from_latest
      tag:
        description: "Release tag (e.g. data-snapshot-20260316-1800). For from_latest this is the NEW tag to create"
        required: false
        default: "data-snapshot-20260330-1020"
      release_type:
        description: "Release type: snapshot | full"
        required: true
        default: "snapshot"
      asset_url:
        description: "[Bootstrap only] Parquet URL"
        required: false
        default: "https://drive.google.com/file/d/1tpYChlp1yi2mXBTALtmt61yXb5XAhGaR/view?usp=sharing"
      json_url:
        description: "[Bootstrap only] Snapshot manifest JSON URL (optional)"
        required: false
        default: "https://drive.google.com/file/d/15LSUtrkSEuUR2_PcZ9m5feR4xtihvJXW/view?usp=sharing"
      sha256_url:
        description: "[Bootstrap only] Snapshot sha256 URL (optional)"
        required: false
        default: "https://drive.google.com/file/d/1NnI8rU9JLs2v2FhP-NEQCorLyxaSDZPG/view?usp=sharing"
      ticker_state_url:
        description: "[Bootstrap only] Companion ticker-state parquet URL (optional)"
        required: false
        default: "https://drive.google.com/file/d/1kjUchEK7oEF7kAJsaxmNhCT5tgVZN6ek/view?usp=sharing"
      output1_latest_url:
        description: "[Bootstrap only] Companion output1-latest parquet URL (optional)"
        required: false
        default: "https://drive.google.com/file/d/1SashtE5LYmTNcBUpT06ZOGfQk0kMK2IZ/view?usp=sharing"
      sha256:
        description: "[Bootstrap only] Expected sha256 hex (override; if empty, use sha256 file from sha256_url)"
        required: false
      min_date:
        description: "Min date in asset (YYYY-MM-DD)"
        required: false
      max_date:
        description: "Max date in asset (YYYY-MM-DD)"
        required: false
      asset_name:
        description: "Asset filename (optional; for Drive URL default from tag)"
        required: false
      row_count:
        description: "Optional row count for manifest metadata"
        required: false

permissions:
  contents: write

concurrency:
  group: publish-release
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Configure Git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Acquire lock
        run: |
          python3 - << 'PY'
          import json, os, datetime
          from pathlib import Path
          lock_path = Path("LOCK.json")
          now = datetime.datetime.now(datetime.timezone.utc)
          if lock_path.exists():
              lock = json.loads(lock_path.read_text(encoding="utf-8"))
              exp = lock.get("expires_at")
              if lock.get("locked") and exp:
                  exp_dt = datetime.datetime.fromisoformat(exp.replace("Z","+00:00"))
                  if exp_dt > now:
                      raise SystemExit(f"LOCKED by {lock.get('owner')} until {exp_dt.isoformat()}")
          lock = {
              "locked": True,
              "owner": "github-actions",
              "run_id": os.environ.get("GITHUB_RUN_ID"),
              "started_at": now.isoformat().replace("+00:00","Z"),
              "expires_at": (now + datetime.timedelta(hours=2)).isoformat().replace("+00:00","Z")
          }
          lock_path.write_text(json.dumps(lock, ensure_ascii=False, indent=2), encoding="utf-8")
          PY
          git add LOCK.json
          git commit -m "chore: acquire lock" || true
          git push || true

      - name: Resolve bootstrap defaults
        id: bootstrap_defaults
        if: inputs.mode == 'bootstrap'
        run: |
          TAG="${{ inputs.tag }}"
          ASSET_URL="${{ inputs.asset_url }}"
          DEFAULT_TAG="data-snapshot-20260330-1020"
          DEFAULT_PARQUET_URL="https://drive.google.com/file/d/1tpYChlp1yi2mXBTALtmt61yXb5XAhGaR/view?usp=sharing"
          if [ -z "${ASSET_URL}" ] && [ "${TAG}" = "${DEFAULT_TAG}" ]; then
            echo "Using default asset_url for tag ${DEFAULT_TAG}"
            echo "asset_url=${DEFAULT_PARQUET_URL}" >> $GITHUB_OUTPUT
          else
            echo "asset_url=${ASSET_URL}" >> $GITHUB_OUTPUT
          fi

      - name: Download asset from URL (bootstrap)
        if: inputs.mode == 'bootstrap'
        env:
          ASSET_URL: ${{ steps.bootstrap_defaults.outputs.asset_url }}
          JSON_URL: ${{ inputs.json_url }}
          SHA256_URL: ${{ inputs.sha256_url }}
          TICKER_STATE_URL: ${{ inputs.ticker_state_url }}
          OUTPUT1_LATEST_URL: ${{ inputs.output1_latest_url }}
          ASSET_NAME: ${{ inputs.asset_name }}
          TAG: ${{ inputs.tag }}
          STAGING_AUTH_HEADER: ${{ secrets.STAGING_AUTH_HEADER }}
        run: |
          set -euo pipefail
          mkdir -p _tmp
          download_one() {
            local url="$1"
            local dest="$2"
            if [ -z "$url" ]; then
              return 0
            fi
            if echo "$url" | grep -q 'drive\.google\.com'; then
              echo "Downloading from Google Drive -> $dest"
              python3 -m pip install -q gdown
              gdown "$url" -O "$dest" --fuzzy
            else
              echo "Downloading public URL -> $dest"
              if [ -n "${STAGING_AUTH_HEADER:-}" ]; then
                curl -L --fail -H "${STAGING_AUTH_HEADER}" -o "$dest" "$url"
              else
                curl -L --fail -o "$dest" "$url"
              fi
            fi
          }
          url="${ASSET_URL}"
          if [ -z "$url" ]; then
            echo "Bootstrap mode requires asset_url (or leave defaults: tag data-snapshot-20260330-1020 + Drive URLs)"
            exit 1
          fi
          fname="${ASSET_NAME}"
          if [ -z "${fname}" ]; then
            fname="$(basename "${url%%\?*}")"
          fi
          if echo "$url" | grep -q 'drive\.google\.com'; then
            echo "Downloading from Google Drive (gdown)..."
            python3 -m pip install -q gdown
            file_id=""
            if echo "$url" | grep -qE '/d/[a-zA-Z0-9_-]+'; then
              file_id="$(echo "$url" | sed -n 's/.*\/d\/\([a-zA-Z0-9_-]*\)\/.*/\1/p')"
            fi
            if [ -z "$file_id" ]; then
              file_id="$(echo "$url" | sed -n 's/.*[?&]id=\([a-zA-Z0-9_-]*\).*/\1/p')"
            fi
            if [ -z "$file_id" ]; then
              echo "Could not extract Google Drive FILE_ID from URL"
              exit 1
            fi
            if [ -z "${fname}" ] || [ "$fname" = "uc" ] || [ "$fname" = "view" ]; then
              fname="${TAG}.parquet"
              echo "Using default asset_name: $fname"
            fi
            gdown "https://drive.google.com/uc?id=${file_id}" -O "_tmp/$fname"
          else
            if [ -n "${STAGING_AUTH_HEADER:-}" ]; then
              curl -L --fail -H "${STAGING_AUTH_HEADER}" -o "_tmp/$fname" "$url"
            else
              curl -L --fail -o "_tmp/$fname" "$url"
            fi
          fi
          echo "$fname" > _tmp/asset_name.txt
          download_one "${JSON_URL}" "_tmp/${TAG}.json"
          download_one "${SHA256_URL}" "_tmp/${TAG}.sha256"
          download_one "${TICKER_STATE_URL}" "_tmp/${TAG}.ticker-state.parquet"
          download_one "${OUTPUT1_LATEST_URL}" "_tmp/${TAG}.output1-latest.parquet"

      - name: Download latest release and prepare re-release
        if: inputs.mode == 'from_latest'
        env:
          GH_TOKEN: ${{ secrets.GH_PAT || github.token }}
        run: |
          set -euo pipefail
          mkdir -p _tmp
          echo "Fetching latest data snapshot/full/delta release (skips thema-sector etc.)..."
          LATEST_TAG=$(python3 - <<'PY'
          import json, os, re, subprocess
          pat = re.compile(r"^data-(?:snapshot|full|delta)-\d{8}-\d{4}$")
          repo = os.environ.get("GITHUB_REPOSITORY", "").strip()
          if not repo:
              raise SystemExit("GITHUB_REPOSITORY is not set")
          out = subprocess.check_output(
              ["gh", "release", "list", "--repo", repo, "--limit", "80", "--exclude-drafts", "--json", "tagName"],
              text=True,
          )
          for row in json.loads(out):
              t = (row.get("tagName") or "").strip()
              if pat.match(t):
                  print(t)
                  raise SystemExit(0)
          raise SystemExit("No data-(snapshot|full|delta)-* release found")
          PY
          )
          if [ -z "$LATEST_TAG" ]; then
            echo "No dataset release found. Use bootstrap mode first with asset_url."
            exit 1
          fi
          echo "Latest release: $LATEST_TAG"
          gh release download "$LATEST_TAG" -D _tmp
          fname=$(ls _tmp/*.parquet 2>/dev/null | head -1 | xargs basename)
          if [ -z "$fname" ]; then
            echo "No parquet asset in latest release"
            exit 1
          fi
          echo "$fname" > _tmp/asset_name.txt
          if [ -f "_tmp/"*".sha256" ]; then
            sha256_file=$(ls _tmp/*.sha256 2>/dev/null | head -1)
            cat "$sha256_file" | awk '{print $1}' > _tmp/expected_sha256.txt
          else
            touch _tmp/expected_sha256.txt
          fi

      - name: Resolve expected sha256
        id: sha256_resolve
        run: |
          if [ "${{ inputs.mode }}" = "from_latest" ]; then
            if [ -s _tmp/expected_sha256.txt ]; then
              v=$(head -1 _tmp/expected_sha256.txt | tr -d '\n\r')
              echo "expected=$v" >> $GITHUB_OUTPUT
            else
              python3 - << 'PY'
          import json, os
          from pathlib import Path
          p = Path("data_manifest.json")
          if not p.exists():
              raise SystemExit("from_latest: data_manifest.json not found; run bootstrap first")
          m = json.loads(p.read_text(encoding="utf-8"))
          lc = m.get("latest_current") or {}
          sha = (lc.get("sha256") or "").strip()
          if not sha:
              raise SystemExit("from_latest: latest_current.sha256 not in data_manifest.json")
          with open(os.environ["GITHUB_OUTPUT"], "a") as f:
              f.write(f"expected={sha}\n")
          PY
            fi
          else
            if [ -n "${{ inputs.sha256 }}" ]; then
              echo "expected=${{ inputs.sha256 }}" >> $GITHUB_OUTPUT
            elif [ -f "_tmp/${{ inputs.tag }}.sha256" ]; then
              v=$(awk 'NF {print $1; exit}' "_tmp/${{ inputs.tag }}.sha256" | tr -d '\n\r')
              echo "expected=$v" >> $GITHUB_OUTPUT
            else
              echo "Bootstrap mode needs sha256 input or sha256_url so _tmp/${{ inputs.tag }}.sha256 exists"
              exit 1
            fi
          fi

      - name: Verify sha256
        env:
          EXPECTED: ${{ steps.sha256_resolve.outputs.expected }}
        run: |
          set -euo pipefail
          fname="$(cat _tmp/asset_name.txt)"
          got="$(sha256sum "_tmp/$fname" | awk '{print $1}')"
          echo "Expected: $EXPECTED"
          echo "Got:      $got"
          test "$got" = "$EXPECTED"

      - name: Create release if not exists
        env:
          GH_TOKEN: ${{ secrets.GH_PAT || github.token }}
          TAG: ${{ inputs.tag }}
          RELEASE_TYPE: ${{ inputs.release_type }}
        run: |
          set -euo pipefail
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release exists: $TAG"
          else
            gh release create "$TAG" -t "$TAG" -n "${RELEASE_TYPE^} dataset: $TAG"
          fi

      - name: Upload release assets
        env:
          GH_TOKEN: ${{ secrets.GH_PAT || github.token }}
          TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          for f in _tmp/*; do
            base="$(basename "$f")"
            case "$base" in
              asset_name.txt|expected_sha256.txt)
                continue
                ;;
            esac
            [ -f "$f" ] || continue
            gh release upload "$TAG" "$f" --clobber
          done

      - name: Ensure manifest file
        run: |
          test -f data_manifest.json || printf '%s\n' '{"schema_version":2,"latest_current":null,"latest_full":null,"latest_delta":{"tag":null,"release_type":"delta","file_name":null,"sha256":null,"row_count":null,"created_at":null,"min_date":null,"max_date":null,"assets":[]},"release_type":null,"row_count":null,"created_at":null,"history":{"release_tags":[],"delta_tags":[]},"policy":{"rerun_window_trading_days":10,"format":"parquet","hash":"sha256"}}' > data_manifest.json

      - name: Update manifest
        env:
          TAG: ${{ inputs.tag }}
          RELEASE_TYPE: ${{ inputs.release_type }}
          MODE: ${{ inputs.mode }}
          ASSET_SHA256: ${{ steps.sha256_resolve.outputs.expected }}
          MIN_DATE: ${{ inputs.min_date }}
          MAX_DATE: ${{ inputs.max_date }}
          ROW_COUNT: ${{ inputs.row_count }}
        run: |
          python3 - << 'PY'
          import hashlib, json, os
          from datetime import datetime
          from pathlib import Path
          import sys
          sys.path.insert(0, ".")
          from src.publish.manifest_update import ensure_manifest_structure, build_release_entry, update_manifest_payload
          path = Path("data_manifest.json")
          m = ensure_manifest_structure(json.loads(path.read_text(encoding="utf-8")))
          tag = os.environ["TAG"]
          release_type = os.environ["RELEASE_TYPE"]
          mode = os.environ.get("MODE", "bootstrap")
          sha = os.environ.get("ASSET_SHA256") or ""
          min_date = os.environ.get("MIN_DATE") or None
          max_date = os.environ.get("MAX_DATE") or None
          row_count = os.environ.get("ROW_COUNT") or None
          if mode == "from_latest" and (not min_date or not max_date or row_count is None or not row_count):
              lc = m.get("latest_current") or {}
              min_date = min_date or lc.get("min_date")
              max_date = max_date or lc.get("max_date")
              if row_count is None or row_count == "":
                  row_count = lc.get("row_count")
          fname = Path("_tmp/asset_name.txt").read_text(encoding="utf-8").strip()
          bytes_ = Path("_tmp", fname).stat().st_size
          created_at = datetime.utcnow().isoformat(timespec="seconds") + "Z"
          assets = []
          for p in sorted(Path("_tmp").iterdir()):
              if not p.is_file() or p.name in {"asset_name.txt", "expected_sha256.txt"}:
                  continue
              assets.append({
                  "name": p.name,
                  "sha256": hashlib.sha256(p.read_bytes()).hexdigest(),
                  "bytes": p.stat().st_size,
                  "updated_at": created_at,
                  "release_type": release_type,
              })
          entry = build_release_entry(
            tag=tag,
            release_type=release_type,
            file_name=fname,
            sha256=sha,
            bytes_size=bytes_,
            created_at=created_at,
            row_count=int(row_count) if row_count else None,
            min_date=min_date,
            max_date=max_date,
            assets=assets,
          )
          m = update_manifest_payload(m, entry)
          path.write_text(json.dumps(m, ensure_ascii=False, indent=2), encoding="utf-8")
          PY
          git add data_manifest.json
          git commit -m "data: update manifest for $TAG" || true
          git push

      - name: Release lock
        if: always()
        run: |
          python3 - << 'PY'
          import json
          from pathlib import Path
          lock_path = Path("LOCK.json")
          if lock_path.exists():
              lock = json.loads(lock_path.read_text(encoding="utf-8"))
              lock["locked"] = False
              lock_path.write_text(json.dumps(lock, ensure_ascii=False, indent=2), encoding="utf-8")
          PY
          git add LOCK.json
          git commit -m "chore: release lock" || true
          git push || true
