# Theme(테마) 대/중분류 섹터 리포트: 평일 KST 20:30 (UTC 11:30) + 수동 실행
# - collect_thema_sector_data 가 기본으로 GitHub theme-sector-* 릴리즈에서 theme_history 를 동기화한 뒤 수집한다.
# - 수집 후 theme-sector- 태그로 릴리즈한다.
name: Collect theme sector data

# KIS inquire-investor exposes same-day data only after market close. Run after
# the 20:00 KST alternative-market close so strict enrichment sees final data.
# 20:30 also avoids competing with the 20:15 snapshot refresh schedule.

on:
  workflow_dispatch:
  schedule:
    - cron: "30 11 * * 1-5" # KST 20:30
    - cron: "30 12 * * 1-5" # KST 21:30 retry when the first run failed

permissions:
  contents: write

concurrency:
  # KIS credentials and dataset publication are shared with snapshot workflows.
  group: dataset-release
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
      TZ: Asia/Seoul
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install -r requirements.txt

      - name: Compute release tag and decide whether collection is needed
        id: rel
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="theme-sector-$(date +%Y%m%d)"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          if [ "${{ github.event_name }}" = "schedule" ] && gh release view "$tag" --repo "${{ github.repository }}" >/dev/null 2>&1; then
            echo "should_run=false" >> "$GITHUB_OUTPUT"
            echo "A validated release already exists for today: $tag"
          else
            echo "should_run=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Collect theme sector data
        if: steps.rel.outputs.should_run == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          GITHUB_TOKEN: ${{ github.token }}
          KIS_APP_KEY: ${{ secrets.KIS_APP_KEY }}
          KIS_APP_SECRET: ${{ secrets.KIS_APP_SECRET }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID_STOCK: ${{ secrets.TELEGRAM_CHAT_ID_STOCK }}
          TELEGRAM_MESSAGE_THREAD_ID: ${{ secrets.TELEGRAM_MESSAGE_THREAD_ID }}
        run: |
          python -m scripts.collect_thema_sector_data \
            --theme-history-sync-max-releases 5 \
            --enrichment-workers 6 \
            --investor-policy auto \
            --strict-completeness \
            --telegram

      - name: Publish theme sector release
        if: steps.rel.outputs.should_run == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python -m scripts.publish_theme_sector_release \
            --repo "${{ github.repository }}" \
            --tag "${{ steps.rel.outputs.tag }}"
