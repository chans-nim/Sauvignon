# 최근 N일 Silver 점검(일자별 volume=0 등) + 증분 수집 + 일자별 zero-volume 보정
#
# workflow_dispatch: 옵션 입력 가능
# schedule: 매주 일요일 UTC 21:00 (KST 월요일 06:00), 기본 7일·전체 보정
name: Audit and repair last week (silver)

on:
  workflow_dispatch:
    inputs:
      days:
        description: "점검·보정할 달력 일 수 (종료일 포함)"
        required: false
        default: "7"
      audit_only:
        description: "점검만 (KIS·sync 생략)"
        type: boolean
        required: false
        default: false
      skip_incremental:
        description: "incremental_job 생략"
        type: boolean
        required: false
        default: false
      skip_zero_repair:
        description: "일자별 volume=0 보정 생략"
        type: boolean
        required: false
        default: false
      skip_low_volume_repair:
        description: "일자별 저거래량 이상치 보정 생략"
        type: boolean
        required: false
        default: false
      low_volume_ratio:
        description: "저거래량 임계 비율(오늘<=과거중앙값*비율)"
        required: false
        default: "0.1"
      low_volume_lookback_days:
        description: "저거래량 기준 과거 조회 일수"
        required: false
        default: "30"
      min_baseline_volume:
        description: "저거래량 기준 최소 baseline(중앙값) 거래량"
        required: false
        default: "1000"
      min_history_points:
        description: "저거래량 기준 최소 과거 거래일 수"
        required: false
        default: "10"
      release_repo:
        description: "Silver 동기화 Release repo (URL 또는 owner/repo)"
        required: false
        default: "https://github.com/chans-nim/Sauvignon/releases"
      publish_release:
        description: "보정 결과를 새 snapshot release로 발행"
        type: boolean
        required: false
        default: true
      publish_tag:
        description: "선택: 발행할 release tag (비우면 자동 생성)"
        required: false
        default: ""
  schedule:
    - cron: "0 21 * * 0"

permissions:
  contents: write

concurrency:
  group: refresh-snapshot
  cancel-in-progress: false

jobs:
  audit-repair:
    runs-on: ubuntu-latest
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
      TZ: Asia/Seoul
      INPUT_DAYS: ${{ github.event.inputs.days || '7' }}
      INPUT_AUDIT_ONLY: ${{ github.event.inputs.audit_only || 'false' }}
      INPUT_SKIP_INCREMENTAL: ${{ github.event.inputs.skip_incremental || 'false' }}
      INPUT_SKIP_ZERO_REPAIR: ${{ github.event.inputs.skip_zero_repair || 'false' }}
      INPUT_SKIP_LOW_VOLUME_REPAIR: ${{ github.event.inputs.skip_low_volume_repair || 'false' }}
      INPUT_LOW_VOLUME_RATIO: ${{ github.event.inputs.low_volume_ratio || '0.1' }}
      INPUT_LOW_VOLUME_LOOKBACK_DAYS: ${{ github.event.inputs.low_volume_lookback_days || '30' }}
      INPUT_MIN_BASELINE_VOLUME: ${{ github.event.inputs.min_baseline_volume || '1000' }}
      INPUT_MIN_HISTORY_POINTS: ${{ github.event.inputs.min_history_points || '10' }}
      INPUT_RELEASE_REPO: ${{ github.event.inputs.release_repo || 'https://github.com/chans-nim/Sauvignon/releases' }}
      INPUT_PUBLISH_RELEASE: ${{ github.event.inputs.publish_release || 'true' }}
      INPUT_PUBLISH_TAG: ${{ github.event.inputs.publish_tag || '' }}
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Configure Git (for manifest updates)
        if: env.INPUT_AUDIT_ONLY != 'true' && env.INPUT_PUBLISH_RELEASE == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Sync silver from latest release (base)
        if: env.INPUT_AUDIT_ONLY != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python -m scripts.sync_silver_from_github_release --repo "${INPUT_RELEASE_REPO}"

      - name: Refresh universe (meta.duckdb)
        if: env.INPUT_AUDIT_ONLY != 'true'
        run: |
          python -m scripts.run_master_refresh

      - name: Audit (and optional repair)
        env:
          KIS_APP_KEY: ${{ secrets.KIS_APP_KEY }}
          KIS_APP_SECRET: ${{ secrets.KIS_APP_SECRET }}
          KIS_USER_ID: ${{ secrets.KIS_USER_ID }}
          KIS_ACC_NUM_MAIN: ${{ secrets.KIS_ACC_NUM_MAIN }}
          KIS_ACC_NUM_SUB: ${{ secrets.KIS_ACC_NUM_SUB }}
        run: |
          set -euo pipefail
          ARGS=(--days "${INPUT_DAYS}")
          if [ "${INPUT_AUDIT_ONLY}" = "true" ]; then ARGS+=(--audit-only); fi
          if [ "${INPUT_SKIP_INCREMENTAL}" = "true" ]; then ARGS+=(--skip-incremental); fi
          if [ "${INPUT_SKIP_ZERO_REPAIR}" = "true" ]; then ARGS+=(--skip-zero-repair); fi
          if [ "${INPUT_SKIP_LOW_VOLUME_REPAIR}" = "true" ]; then ARGS+=(--skip-low-volume-repair); fi
          ARGS+=(--low-volume-ratio "${INPUT_LOW_VOLUME_RATIO}")
          ARGS+=(--low-volume-lookback-days "${INPUT_LOW_VOLUME_LOOKBACK_DAYS}")
          ARGS+=(--min-baseline-volume "${INPUT_MIN_BASELINE_VOLUME}")
          ARGS+=(--min-history-points "${INPUT_MIN_HISTORY_POINTS}")
          python -m scripts.audit_repair_last_week "${ARGS[@]}"

      - name: Build snapshot from repaired silver
        if: env.INPUT_AUDIT_ONLY != 'true' && env.INPUT_PUBLISH_RELEASE == 'true'
        id: build_snapshot
        env:
          PUBLISH_TAG: ${{ env.INPUT_PUBLISH_TAG }}
        run: |
          python - << 'PY'
          import json, os, subprocess, sys
          cmd = [sys.executable, "-m", "src.jobs.full_snapshot_job", "--mode", "snapshot"]
          publish_tag = (os.environ.get("PUBLISH_TAG") or "").strip()
          if publish_tag:
              cmd += ["--tag", publish_tag]
          p = subprocess.run(cmd, capture_output=True, text=True, check=True)
          out = (p.stdout or "").strip()
          i = out.rfind("{")
          if i < 0:
              print(out)
              raise SystemExit("Could not find JSON in snapshot build output")
          payload_text = out[i:]
          payload = json.loads(payload_text)
          print(json.dumps(payload, ensure_ascii=False))
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as f:
              f.write(f"tag={payload['tag']}\n")
              f.write(f"parquet_path={payload['parquet_path']}\n")
              f.write(f"sha_path={payload['sha_path']}\n")
              f.write(f"manifest_path={payload['manifest_path']}\n")
              f.write(f"sha256={payload['sha256']}\n")
              f.write(f"row_count={payload.get('row_count') or ''}\n")
              f.write(f"min_date={payload.get('min_date') or ''}\n")
              f.write(f"max_date={payload.get('max_date') or ''}\n")
          PY

      - name: Validate built snapshot (local)
        if: env.INPUT_AUDIT_ONLY != 'true' && env.INPUT_PUBLISH_RELEASE == 'true'
        run: |
          python -m scripts.validate_snapshot --file-path "${{ steps.build_snapshot.outputs.parquet_path }}" --allow-missing-meta

      - name: Create release if not exists
        if: env.INPUT_AUDIT_ONLY != 'true' && env.INPUT_PUBLISH_RELEASE == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.build_snapshot.outputs.tag }}
        run: |
          set -euo pipefail
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release exists: $TAG"
          else
            gh release create "$TAG" -t "$TAG" -n "Snapshot dataset: $TAG"
          fi

      - name: Upload release assets
        if: env.INPUT_AUDIT_ONLY != 'true' && env.INPUT_PUBLISH_RELEASE == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.build_snapshot.outputs.tag }}
        run: |
          set -euo pipefail
          shopt -s nullglob
          files=(data/snapshot/"${TAG}"*)
          if [ "${#files[@]}" -eq 0 ]; then
            echo "No bundle files under data/snapshot for ${TAG}"
            exit 1
          fi
          for f in "${files[@]}"; do
            [ -f "$f" ] || continue
            echo "Uploading $f"
            gh release upload "$TAG" "$f" --clobber
          done

      - name: Update data_manifest.json
        if: env.INPUT_AUDIT_ONLY != 'true' && env.INPUT_PUBLISH_RELEASE == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.build_snapshot.outputs.tag }}
          RELEASE_TYPE: snapshot
          ASSET_SHA256: ${{ steps.build_snapshot.outputs.sha256 }}
          MIN_DATE: ${{ steps.build_snapshot.outputs.min_date }}
          MAX_DATE: ${{ steps.build_snapshot.outputs.max_date }}
          ROW_COUNT: ${{ steps.build_snapshot.outputs.row_count }}
        run: |
          python3 - << 'PY'
          import json, os
          from datetime import datetime
          from pathlib import Path
          import sys
          sys.path.insert(0, ".")
          from src.publish.manifest_update import (
              build_assets_from_bundle_dir,
              build_release_entry,
              ensure_manifest_structure,
              update_manifest_payload,
          )
          tag = os.environ["TAG"]
          release_type = os.environ["RELEASE_TYPE"]
          sha = os.environ["ASSET_SHA256"]
          min_date = os.environ.get("MIN_DATE") or None
          max_date = os.environ.get("MAX_DATE") or None
          row_count = os.environ.get("ROW_COUNT") or None
          path = Path("data_manifest.json")
          m = ensure_manifest_structure(json.loads(path.read_text(encoding="utf-8")) if path.exists() else None)
          fname = f"{tag}.parquet"
          parquet_path = Path("data/snapshot") / fname
          bytes_ = parquet_path.stat().st_size if parquet_path.exists() else 0
          created_at = datetime.utcnow().isoformat(timespec="seconds") + "Z"
          assets = build_assets_from_bundle_dir(tag, release_type=release_type, created_at=created_at)
          entry = build_release_entry(
              tag=tag,
              release_type=release_type,
              file_name=fname,
              sha256=sha,
              bytes_size=bytes_,
              created_at=created_at,
              row_count=(int(row_count) if row_count else None),
              min_date=min_date,
              max_date=max_date,
              assets=assets,
          )
          m = update_manifest_payload(m, entry)
          path.write_text(json.dumps(m, ensure_ascii=False, indent=2), encoding="utf-8")
          PY
          git add data_manifest.json
          git commit -m "data: update manifest for $TAG" || true
          git push
