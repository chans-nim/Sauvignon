# Theme(테마) 대/중분류 섹터 리포트: 평일 KST 16:00 (UTC 07:00) + 수동 실행
# - collect_thema_sector_data 가 기본으로 GitHub theme-sector-* 릴리즈에서 theme_history 를 동기화한 뒤 수집한다.
# - 수집 후 theme-sector- 태그로 릴리즈한다.
name: Collect theme sector data

on:
  workflow_dispatch:
  schedule:
    - cron: "0 7 * * 1-5"

permissions:
  contents: write

concurrency:
  group: collect-theme-sector-data
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
      TZ: Asia/Seoul
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Collect theme sector data
        env:
          KIS_APP_KEY: ${{ secrets.KIS_APP_KEY }}
          KIS_APP_SECRET: ${{ secrets.KIS_APP_SECRET }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID_STOCK: ${{ secrets.TELEGRAM_CHAT_ID_STOCK }}
          TELEGRAM_MESSAGE_THREAD_ID: ${{ secrets.TELEGRAM_MESSAGE_THREAD_ID }}
        run: |
          python -m scripts.collect_thema_sector_data --enrichment-workers 6 --telegram

      - name: Compute release tag (KST)
        id: rel
        run: |
          echo "tag=theme-sector-$(date +%Y%m%d-%H%M)" >> "$GITHUB_OUTPUT"

      - name: Publish theme sector release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python -m scripts.publish_theme_sector_release \
            --repo "${{ github.repository }}" \
            --tag "${{ steps.rel.outputs.tag }}"
