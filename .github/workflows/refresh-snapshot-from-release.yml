# Refresh Snapshot from GitHub Release
#
# 실패 가능 지점 요약:
# - Acquire lock 실패: 동시 실행 방지용; push 실패 시 job 실패 (의도됨).
# - Sync from Release: GH_TOKEN/권한, release에 *.parquet 없음, sha256 불일치 시 실패.
# - Refresh universe: KOSPI/KOSDAQ master 다운로드 실패 시 실패 (최대 3회 재시도).
# - Incremental collect: KIS 시크릿 없음/만료/한도 초과 시 일부·전량 실패.
# - Repair zero-volume: 당일 MAX(date)에서 volume=0·close>0 종목만 KIS 재수집(기존 청크 무시).
#   전량 실패 시 run_daily_collect가 exit(1)하여 스냅샷 덮어쓰기 방지.
# - Build snapshot: silver 없음/스키마 오류 시 실패.
# - Validate: 품질 기준 미달 시 실패 (배포 전 차단).
# - Create release / Upload assets: GH 권한·용량 한도 시 실패.
# - Update data_manifest.json 후 push: 충돌 시 실패 (동시 수정 없으면 정상).
# - Release lock (if: always()): 실패해도 다음 run에서 lock 만료 후 진행 가능.
#
# 스케줄(둘 다 월~금):
# - UTC 07:30 = KST 16:30 : 장중/마감 전에도 수집 가능. 당일 봉은 이후 재수집 시 갱신됨.
# - UTC 11:15 = KST 20:15 : 대체 장마감(20:00 KST) 이후 당일 최종 반영을 목표로 한 재수집.
name: Refresh Snapshot from GitHub Release

on:
  workflow_dispatch:
    inputs:
      repo:
        description: "Release repo (owner/name or URL)"
        required: false
        default: "https://github.com/chans-nim/Sauvignon/releases"
      tag:
        description: "Optional: base release tag to sync (default: data_manifest.latest_current or gh latest)"
        required: false
      publish_tag:
        description: "Optional: new snapshot tag to publish (default: auto data-snapshot-YYYYMMDD-HHMM)"
        required: false
  schedule:
    - cron: "30 1 * * 1-5" # KST 16:30
    - cron: "15 11 * * 1-5" # KST 20:15 (20:00 대체 종료 이후)

permissions:
  contents: write

concurrency:
  group: refresh-snapshot
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Configure Git (for manifest updates)
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Acquire lock
        run: |
          python3 - << 'PY'
          import json, os, datetime
          from pathlib import Path
          lock_path = Path("LOCK.json")
          now = datetime.datetime.now(datetime.timezone.utc)
          if lock_path.exists():
              lock = json.loads(lock_path.read_text(encoding="utf-8"))
              exp = lock.get("expires_at")
              if lock.get("locked") and exp:
                  exp_dt = datetime.datetime.fromisoformat(exp.replace("Z","+00:00"))
                  if exp_dt > now:
                      raise SystemExit(f"LOCKED by {lock.get('owner')} until {exp_dt.isoformat()}")
          lock = {
              "locked": True,
              "owner": "github-actions",
              "run_id": os.environ.get("GITHUB_RUN_ID"),
              "started_at": now.isoformat().replace("+00:00","Z"),
              "expires_at": (now + datetime.timedelta(hours=2)).isoformat().replace("+00:00","Z")
          }
          lock_path.write_text(json.dumps(lock, ensure_ascii=False, indent=2), encoding="utf-8")
          PY
          git add LOCK.json
          git commit -m "chore: acquire lock" || true
          git push

      - name: Sync base snapshot from GitHub Release to silver
        env:
          GH_TOKEN: ${{ github.token }}
          REPO_INPUT: ${{ inputs.repo }}
          TAG_INPUT: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          if [ -n "${TAG_INPUT}" ]; then
            python -m scripts.sync_silver_from_github_release --repo "${REPO_INPUT}" --tag "${TAG_INPUT}"
          else
            python -m scripts.sync_silver_from_github_release --repo "${REPO_INPUT}"
          fi

      - name: Refresh universe (build meta.duckdb)
        run: |
          python -m scripts.run_master_refresh

      - name: Incremental collect + gap fill (keep latest)
        env:
          TZ: Asia/Seoul
          KIS_APP_KEY: ${{ secrets.KIS_APP_KEY }}
          KIS_APP_SECRET: ${{ secrets.KIS_APP_SECRET }}
          KIS_USER_ID: ${{ secrets.KIS_USER_ID }}
          KIS_ACC_NUM_MAIN: ${{ secrets.KIS_ACC_NUM_MAIN }}
          KIS_ACC_NUM_SUB: ${{ secrets.KIS_ACC_NUM_SUB }}
        run: |
          python -m scripts.run_daily_collect

      - name: Repair zero-volume on latest date (silver, re-fetch)
        env:
          TZ: Asia/Seoul
          KIS_APP_KEY: ${{ secrets.KIS_APP_KEY }}
          KIS_APP_SECRET: ${{ secrets.KIS_APP_SECRET }}
          KIS_USER_ID: ${{ secrets.KIS_USER_ID }}
          KIS_ACC_NUM_MAIN: ${{ secrets.KIS_ACC_NUM_MAIN }}
          KIS_ACC_NUM_SUB: ${{ secrets.KIS_ACC_NUM_SUB }}
        run: |
          python -m scripts.repair_zero_volume_day

      - name: Build snapshot
        id: build_snapshot
        env:
          PUBLISH_TAG: ${{ inputs.publish_tag }}
        run: |
          python - << 'PY'
          import json, os, subprocess, sys
          cmd = [sys.executable, "-m", "src.jobs.full_snapshot_job", "--mode", "snapshot"]
          publish_tag = (os.environ.get("PUBLISH_TAG") or "").strip()
          if publish_tag:
              cmd += ["--tag", publish_tag]
          p = subprocess.run(cmd, capture_output=True, text=True, check=True)
          # full_snapshot_job prints JSON at the end, but may include logs.
          out = (p.stdout or "").strip()
          # Try to parse the last JSON object from stdout.
          i = out.rfind("{")
          if i < 0:
              print(out)
              raise SystemExit("Could not find JSON in snapshot build output")
          payload_text = out[i:]
          try:
              payload = json.loads(payload_text)
          except Exception:
              # Fallback: find a line that starts with '{' and use the last one
              candidates = [ln for ln in out.splitlines() if ln.lstrip().startswith("{")]
              if not candidates:
                  print(out)
                  raise
              payload = json.loads(candidates[-1])
          print(json.dumps(payload, ensure_ascii=False))
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as f:
              f.write(f"tag={payload['tag']}\n")
              f.write(f"parquet_path={payload['parquet_path']}\n")
              f.write(f"sha_path={payload['sha_path']}\n")
              f.write(f"manifest_path={payload['manifest_path']}\n")
              f.write(f"sha256={payload['sha256']}\n")
              f.write(f"row_count={payload.get('row_count') or ''}\n")
              f.write(f"min_date={payload.get('min_date') or ''}\n")
              f.write(f"max_date={payload.get('max_date') or ''}\n")
          PY

      - name: Validate built snapshot (local)
        run: |
          python -m scripts.validate_snapshot --file-path "${{ steps.build_snapshot.outputs.parquet_path }}" --allow-missing-meta

      - name: Collection health report (logs)
        run: |
          python -m scripts.verify_collection

      - name: Create release if not exists
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.build_snapshot.outputs.tag }}
        run: |
          set -euo pipefail
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release exists: $TAG"
          else
            gh release create "$TAG" -t "$TAG" -n "Snapshot dataset: $TAG"
          fi

      - name: Upload release assets
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.build_snapshot.outputs.tag }}
        run: |
          set -euo pipefail
          gh release upload "$TAG" "${{ steps.build_snapshot.outputs.parquet_path }}" --clobber
          gh release upload "$TAG" "${{ steps.build_snapshot.outputs.sha_path }}" --clobber
          gh release upload "$TAG" "${{ steps.build_snapshot.outputs.manifest_path }}" --clobber

      - name: Update data_manifest.json
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.build_snapshot.outputs.tag }}
          RELEASE_TYPE: snapshot
          ASSET_SHA256: ${{ steps.build_snapshot.outputs.sha256 }}
          MIN_DATE: ${{ steps.build_snapshot.outputs.min_date }}
          MAX_DATE: ${{ steps.build_snapshot.outputs.max_date }}
          ROW_COUNT: ${{ steps.build_snapshot.outputs.row_count }}
        run: |
          python3 - << 'PY'
          import json, os
          from datetime import datetime
          from pathlib import Path
          import sys
          sys.path.insert(0, ".")
          from src.publish.manifest_update import ensure_manifest_structure, build_release_entry, update_manifest_payload
          tag = os.environ["TAG"]
          release_type = os.environ["RELEASE_TYPE"]
          sha = os.environ["ASSET_SHA256"]
          min_date = os.environ.get("MIN_DATE") or None
          max_date = os.environ.get("MAX_DATE") or None
          row_count = os.environ.get("ROW_COUNT") or None
          path = Path("data_manifest.json")
          m = ensure_manifest_structure(json.loads(path.read_text(encoding="utf-8")) if path.exists() else None)
          fname = f"{tag}.parquet"
          parquet_path = Path("data/snapshot") / fname
          bytes_ = parquet_path.stat().st_size if parquet_path.exists() else 0
          created_at = datetime.utcnow().isoformat(timespec="seconds") + "Z"
          entry = build_release_entry(
              tag=tag,
              release_type=release_type,
              file_name=fname,
              sha256=sha,
              bytes_size=bytes_,
              created_at=created_at,
              row_count=(int(row_count) if row_count else None),
              min_date=min_date,
              max_date=max_date,
          )
          m = update_manifest_payload(m, entry)
          path.write_text(json.dumps(m, ensure_ascii=False, indent=2), encoding="utf-8")
          PY
          git add data_manifest.json
          git commit -m "data: update manifest for $TAG" || true
          git push

      - name: Release lock
        if: always()
        run: |
          python3 - << 'PY'
          import json
          from pathlib import Path
          lock_path = Path("LOCK.json")
          if lock_path.exists():
              lock = json.loads(lock_path.read_text(encoding="utf-8"))
              lock["locked"] = False
              lock_path.write_text(json.dumps(lock, ensure_ascii=False, indent=2), encoding="utf-8")
          PY
          git add LOCK.json
          git commit -m "chore: release lock" || true
          git push || true

